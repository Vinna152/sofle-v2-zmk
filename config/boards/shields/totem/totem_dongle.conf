CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Prospector module: no APDS9960 ambient light sensor on this build.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50

### Screen settings
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

### BLE TX power: boost dongle to +8 dBm (nRF52840 max). USB-powered, no battery cost.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
